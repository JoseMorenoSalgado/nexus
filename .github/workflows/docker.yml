name: Validar imagen de Docker para Dockploy

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'prisma/**'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'src/**'
      - 'package.json'
      - 'prisma/**'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Revisar configuración Compose sin credenciales reales
        env:
          DATABASE_URL: mysql://webappecloud:testpassword@db:3306/webappecloud
          MARIADB_PASSWORD: testpassword
          MARIADB_ROOT_PASSWORD: testrootpassword
          INSTALLER_TOKEN: CI-ONLY-NOT-A-SECRET-INTEGRATION-2026
        run: docker compose config --quiet
      - name: Construir imagen de aplicación
        run: docker build --progress=plain -t webappecloud:ci .
