name: Nexus PostgreSQL standalone validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: ciuser
          POSTGRES_PASSWORD: ci_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ciuser -d nexus_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://ciuser:ci_password_only@127.0.0.1:5432/nexus_ci
      SITE_URL: https://nexus-ci.example
      SEED_DOMAIN: nexus-ci.example
      ADMIN_EMAIL: admin@ci.invalid
      ADMIN_PASSWORD: CI-PASSWORD-NOT-PRODUCTION-2345
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev --no-audit --no-fund
      - name: Verify standalone code isolation
        run: node scripts/check-standalone-isolation.mjs
      - run: npm run db:generate
      - run: npx prisma db push --schema prisma/schema.postgres.prisma
      - run: npm run db:seed
      - run: node --import tsx --test scripts/standalone-installation.test.mjs
      - run: node --import tsx scripts/check-standalone-postgres.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Public HTTP smoke test
        run: |
          (npm start > /tmp/nexus-postgres.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 3 -H 'Host: nexus-ci.example' http://127.0.0.1:3000/ -o /tmp/nexus-home.html; then
              echo 'Home HTTP 200'
              exit 0
            fi
            sleep 2
          done
          tail -n 100 /tmp/nexus-postgres.log
          exit 1

  fresh-standalone:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_fresh
          POSTGRES_USER: ciuser
          POSTGRES_PASSWORD: ci_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ciuser -d nexus_fresh"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://ciuser:ci_password_only@127.0.0.1:5432/nexus_fresh
      NEXUS_STANDALONE: 'true'
      NODE_ENV: test
      SITE_URL: https://nexus-ci.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm run db:generate
      - name: Initialize isolated PostgreSQL schema
        run: npx prisma db push --schema prisma/schema.standalone.postgres.prisma
      - name: Verify independent tables and queries
        run: node --import tsx scripts/check-fresh-standalone-db.ts
      - name: Verify standalone financial lifecycle
        run: node --import tsx scripts/check-fresh-standalone-finance.ts
      - name: Seed independent public smoke fixtures
        run: node --import tsx scripts/seed-standalone-public-smoke.ts
      - name: Build standalone public application
        run: npm run build
      - name: Test independent public HTTP routes
        run: |
          (npm start > /tmp/nexus-standalone-public.log 2>&1 &)
          ready=0
          for i in $(seq 1 60); do
            if curl --location --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ -o /tmp/nexus-standalone-home.html; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Standalone homepage unavailable"
            tail -n 100 /tmp/nexus-standalone-public.log
            exit 1
          fi
          check_page() {
            label="$1"
            url="$2"
            expected="$3"
            file="$4"
            echo "Checking $label: $url"
            if ! curl --location --fail --silent --show-error --max-time 15 "$url" -o "$file"; then
              echo "::error::$label returned HTTP error"
              tail -n 100 /tmp/nexus-standalone-public.log
              return 1
            fi
            if ! grep -Fq "$expected" "$file"; then
              echo "::error::$label returned HTML without expected content: $expected"
              head -c 700 "$file"
              echo
              tail -n 100 /tmp/nexus-standalone-public.log
              return 1
            fi
          }
          check_page "Standalone homepage" http://127.0.0.1:3000/ "Encuentra el lugar" /tmp/nexus-standalone-home.html
          check_page "Standalone catalog" http://127.0.0.1:3000/propiedades "CI published property" /tmp/nexus-standalone-catalog.html
          check_page "Standalone property" http://127.0.0.1:3000/propiedades/ci-public-property "CI published property" /tmp/nexus-standalone-detail.html
          if grep -Fq "CI draft property" /tmp/nexus-standalone-catalog.html; then
            echo "::error::Unpublished property leaked into public catalog"
            exit 1
          fi
          draft_status=$(curl --location --silent --output /tmp/nexus-standalone-draft.html --write-out "%{http_code}" --max-time 15 http://127.0.0.1:3000/propiedades/ci-draft-property)
          if [ "$draft_status" != "404" ]; then
            echo "::error::Unpublished property detail returned HTTP $draft_status instead of 404"
            tail -n 100 /tmp/nexus-standalone-public.log
            exit 1
          fi
          echo "Standalone public HTTP smoke and unpublished-property isolation passed"
